<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>计算机知识库 · 从零开始的计算机专业学习手册</title>
  <meta name="description" content="一个汇集编程语言、数据结构、算法、计算机网络、操作系统、数据库、工程化等全部计算机专业知识的交互式学习网站，内置在线编辑器与代码模板，支持手机/平板（含安卓）与本地编译器联动，新手友好。" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234f46e5'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>&lt;/&gt;</text></svg>" />
  <link rel="stylesheet" href="assets/css/style.css?v=20260905c" />
  <!-- CodeMirror 5 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/eclipse.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css" />
</head>
<body>
  <style>
    /* 页面加载保护：防止白屏闪烁 */
    #app { opacity: 0; transition: opacity 0.3s ease; }
    #app.loaded { opacity: 1; }
    .loading-overlay {
      position: fixed; inset: 0; background: var(--bg, #0f172a);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; color: var(--text, #e2e8f0); font-size: 18px;
      font-family: system-ui, sans-serif;
    }
  </style>

  <div class="loading-overlay" id="loadingOverlay">正在加载知识库…</div>

  <div id="app">
    <!-- 顶部栏 -->
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="menuToggle" title="菜单" aria-label="菜单">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="brand" id="brandHome">
        <div class="brand-logo">&lt;/&gt;</div>
        <span>计算机知识库</span>
        <span class="brand-badge">CS 手册</span>
      </div>

      <div class="search-wrap">
        <svg class="search-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
        <input class="search-input" id="searchInput" type="text" placeholder="搜索语言、知识点、命令…（如 python、排序、git、http）" autocomplete="off" />
        <div class="search-results" id="searchResults"></div>
      </div>

      <div class="topbar-actions">
        <button class="icon-btn" id="toggleSidebar" title="收起/展开目录" aria-label="目录">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h20M2 9h12M2 14h20M2 19h12"/></svg>
        </button>
        <button class="icon-btn" id="toggleEditor" title="编辑器 / 教程视图" aria-label="编辑器">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
        </button>
        <button class="icon-btn" id="goHome" title="返回首页" aria-label="首页">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        </button>
      </div>
    </header>

    <div class="main">
      <!-- 侧边栏 -->
      <aside class="sidebar" id="sidebar"></aside>

      <!-- 内容区 -->
      <main class="content" id="content">
        <div class="content-inner" id="contentInner"></div>
      </main>

      <!-- 编辑器面板 -->
      <section class="editor-panel hidden" id="editorPanel">
        <div class="editor-head">
          <div class="eh-title">
            <span id="editorTitle">在线编辑器</span>
            <span class="eh-lang" id="ehLang">javascript</span>
          </div>
          <div class="eh-actions">
            <select class="tpl-select" id="tplSelect" title="内置模板"></select>
            <button class="run-btn" id="runBtn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20"/></svg>
              <span id="runBtnText">运行</span>
            </button>
          </div>
        </div>
        <div class="editor-toolbar">
          <button class="tool-btn" id="envBtn" title="检测本机/浏览器环境">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
            环境
          </button>
          <span class="tool-sep"></span>
          <button class="tool-btn" id="copyCodeBtn" title="复制编辑器全部代码">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            复制
          </button>
          <button class="tool-btn" id="downloadBtn" title="下载代码为文件">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            下载
          </button>
          <button class="tool-btn" id="resetBtn" title="恢复为当前模板">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
            重置
          </button>
          <button class="tool-btn" id="clearOutBtn" title="清空输出">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
            清空
          </button>
          <span class="tool-sep"></span>
          <button class="tool-btn icon-btn2" id="fontDec" title="缩小字号">A−</button>
          <button class="tool-btn icon-btn2" id="fontInc" title="放大字号">A+</button>
          <button class="tool-btn icon-btn2" id="themeBtn" title="切换明暗主题">◐</button>
          <span class="tool-status" id="toolStatus"></span>
        </div>
        <div class="editor-body">
          <textarea id="codeEditor"></textarea>
          <div class="editor-output">
            <div class="out-head"><span class="dot" id="outDot"></span> 输出
              <button class="out-clear" id="outClearBtn" title="清空输出">清空</button>
            </div>
            <div class="out-body empty" id="outBody">点击「运行」查看代码执行结果（支持 JavaScript / HTML / CSS / Python / SQL，更多语言可联动本地编译器）。</div>
          </div>
        </div>
        <div class="editor-status">
          <span class="es-lang" id="statusLang">javascript</span>
          <span class="es-pos" id="statusPos">1:1</span>
          <span class="es-hint" id="statusHint">Ctrl/⌘+Enter 运行 · 自动保存</span>
          <span class="es-mode" id="statusMode">在线</span>
        </div>
      </section>
    </div>
  </div>

  <!-- 环境检测弹窗 -->
  <div class="modal-mask hidden" id="envModal">
    <div class="modal">
      <div class="modal-head">
        <span>本机 / 浏览器环境检测</span>
        <button class="modal-close" id="envClose" title="关闭">×</button>
      </div>
      <div class="modal-body" id="envBody"></div>
    </div>
  </div>

  <!-- 轻提示 -->
  <div class="toast hidden" id="toast"></div>

  <!-- CodeMirror 5 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sass/sass.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/yaml/yaml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/lua/lua.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/haskell/haskell.min.js"></script>
